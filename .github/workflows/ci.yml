name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo bench --workspace --no-run --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --locked -p emberkv-server -p emberkv-cli
      - name: Type-check SDK
        working-directory: sdk/typescript
        run: npm ci && npm run typecheck
      - name: Product flows against a live server
        run: |
          ./target/release/ekv token --name ci --namespaces sessions,otp,limits,idempotency,flags > key.txt
          sed -n '/^\[\[key\]\]/,$p' key.txt > auth.toml
          ./target/release/emberkv-server --data-dir "$RUNNER_TEMP/data" --auth-file auth.toml &
          for i in $(seq 30); do curl -sf localhost:8080/readyz && break; sleep 0.2; done
          cd sdk/typescript && EMBERKV_TOKEN=$(grep -o 'ekv_[0-9a-f]*' ../../key.txt) npm run example

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t emberkv:ci .
